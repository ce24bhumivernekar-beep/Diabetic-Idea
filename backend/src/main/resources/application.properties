spring.application.name=backend

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------
# MongoDB
# ------------------------------------------------------------
# Spring Boot 4 renamed the connection properties: spring.data.mongodb.uri
# is deprecated at error level and is IGNORED, which silently sends every
# document to Mongo's default "test" database.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/diabetic_retinopathy}

# Still under the data prefix (Spring Data mapping concern, not connection).
spring.data.mongodb.auto-index-creation=true

# ------------------------------------------------------------
# Python AI service (FastAPI)
# ------------------------------------------------------------
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout-seconds=${AI_SERVICE_TIMEOUT:120}

# ------------------------------------------------------------
# Frontend origins allowed to call this API (CORS)
#
# Patterns, not literals, so a phone on the same Wi-Fi can use the app
# without adding its address here. Tighten this for any real deployment.
# ------------------------------------------------------------
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*],http://172.16.*:[*],http://172.17.*:[*],http://172.18.*:[*],http://172.19.*:[*],http://172.2*.*:[*],http://172.3*.*:[*],https://*.ts.net,https://*.ts.net:[*]}

# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:sih-diabetic-retinopathy-secret-key-2026-change-this}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------
# Uploads
# ------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
