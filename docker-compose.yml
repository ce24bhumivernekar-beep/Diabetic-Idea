# Whole platform on one machine. Suits a free Oracle Cloud ARM VM, which has
# enough memory for TensorFlow, and avoids the cold starts of free tiers.
#
#   docker compose up -d --build
#
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
      args:
        AI_MODEL_URL: ${AI_MODEL_URL:-}
    restart: unless-stopped
    environment:
      CORS_ALLOWED_ORIGINS: "*"
    healthcheck:
      # The graph compile takes ~25s at boot, so the start period is generous.
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/diabetic_retinopathy
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - the default is public}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-https://*}
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty means same-origin; Caddy or the platform routes /api itself.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_AI_URL: ${VITE_AI_URL:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
