# Render blueprint - free tier only, no card required.
#
# Only the Spring Boot API lives here. The AI service does NOT: TensorFlow
# needs roughly 1.5 GB and Render's free instance gives 512 MB, so it would
# crashloop. It runs on a Hugging Face Space instead (free, 16 GB) - see
# ai-service/README.md.
#
# MongoDB is a free Atlas M0 cluster; Render has no free managed Mongo.
services:
  - type: web
    name: dr-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false                 # paste the Atlas connection string
      - key: AI_SERVICE_URL
        sync: false                 # https://<user>-<space>.hf.space
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false                 # e.g. https://*.vercel.app
      # Free instances are memory capped; keep the JVM inside it.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
