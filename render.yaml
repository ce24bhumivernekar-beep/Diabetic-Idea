# Render blueprint - free tier throughout, no card required.
#
# All three services fit here now. The AI service serves the model through
# ONNX Runtime rather than TensorFlow: TF needs over a gigabyte at rest, the
# ONNX build holds ~120 MB, which fits the 512 MB free instance. Hugging Face
# Spaces was the earlier plan but Docker Spaces now require a paid PRO plan.
#
# MongoDB is a free Atlas M0 cluster; Render has no free managed Mongo.
services:
  - type: web
    name: dr-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: dr-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false                 # Atlas connection string
      - key: AI_SERVICE_URL
        sync: false                 # https://<user>-<space>.hf.space
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://*.onrender.com,https://*.hf.space,http://localhost:[*]"
      # Free instances are memory capped; keep the JVM inside it.
      # No -Xss override: 512k stacks are too small for Spring's startup
      # reflection and can abort the boot with a StackOverflowError.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC

  - type: web
    name: dr-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Baked in at build time. The dev-server proxy does not exist in a
      # static build, so the browser must be told where the services live.
      - key: VITE_API_URL
        sync: false                 # https://dr-backend.onrender.com
      - key: VITE_AI_URL
        sync: false                 # https://<user>-<space>.hf.space
    routes:
      # Single-page app: unknown paths are routes, not missing files.
      - type: rewrite
        source: /*
        destination: /index.html
